[package]
# rust_app.cmake links librustapp.a, so the package is named rustapp.
name = "rustapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Body ECU's MCU firmware in Rust, as a Zephyr application"

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[features]
# Report properties and events to Forkpoint's hostcall window (BODY_ECU_FORKPOINT).
forkpoint = ["forkpoint/enabled"]
# The speed simulator on the ADC (CONFIG_ADC).
adc = ["body-ecu-adapters/adc"]
# The CAN gateway and DoCAN (CONFIG_CAN).
can = ["body-ecu-adapters/can"]

[dependencies]
body-ecu-ports.workspace = true
body-ecu-lighting.workspace = true
body-ecu-door-lock.workspace = true
body-ecu-vehicle-mode.workspace = true
body-ecu-ignition.workspace = true
body-ecu-diagnostics.workspace = true
body-ecu-adapters = { workspace = true, features = ["transport"] }
body-ecu-ffi.workspace = true
forkpoint.workspace = true
openbsw-async.workspace = true
openbsw-async-zephyr.workspace = true
openbsw-bsp-zephyr.workspace = true
openbsw-lifecycle.workspace = true
openbsw-runtime.workspace = true
openbsw-zephyr-ffi.workspace = true
