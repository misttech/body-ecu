# The Rust firmware with rivet as its C library, through rivet_module/ (see README.md).
CONFIG_EXTERNAL_LIBC=y
# Zephyr's stdout hook is for its own C libraries; rivet's printf ends in write(), which
# the shim sends to the console UART. Nothing here prints through it: the firmware prints
# with printk and Zephyr's log.
CONFIG_STDOUT_CONSOLE=n
