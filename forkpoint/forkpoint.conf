# Overrides for Forkpoint's deterministic virtual MCU (the NUCLEO-H743ZI board, which runs
# this nucleo_h753zi image). The ADC is left out as renode.conf leaves it out: the virtual
# board has no STM32H7 ADC, and the application takes its emulator path (no speed
# simulator) when the debug identity code reads 0 there, as it does on Renode.
CONFIG_ADC=n
